  --bg: #f5f4f0;
  --surface: #ffffff;
  --surface2: #eeece6;
  --border: #dedad0;
  --fg: #18160f;
  --fg2: #585448;
  --fg3: #9a9484;
  --accent: #2a6049;
  --accent-bg: #d6ede2;
  --accent-hover: #1f4d3a;
  --remoteok: #1f7a5c;
  --remoteok-bg: #d9f0e8;
  --wwr: #c0392b;
  --wwr-bg: #fce8e6;
  --remotive: #2563eb;
  --remotive-bg: #dbeafe;
  --yc: #d97706;
  --yc-bg: #fef3c7;
  --wf: #7c3aed;
  --wf-bg: #ede9fe;
  --gold: #b45309;
  --gold-bg: #fef3c7;
  --tag-bg: #e8e6df;
  --tag-fg: #48453b;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.04);
  --shadow-hover: 0 4px 20px rgba(0,0,0,.12);
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #100f0d; --surface: #1a1916; --surface2: #232119; --border: #2c2a24;
  --fg: #e8e4da; --fg2: #9a9484; --fg3: #605c50;
  --accent: #4ade80; --accent-bg: #052e16; --accent-hover: #22c55e;
  --remoteok: #34d399; --remoteok-bg: #064e3b; --wwr: #f87171; --wwr-bg: #450a0a;
  --remotive: #60a5fa; --remotive-bg: #1e3a5f; --yc: #fbbf24; --yc-bg: #451a03;
  --wf: #a78bfa; --wf-bg: #2e1065; --gold: #fbbf24; --gold-bg: #451a03;
  --tag-bg: #2c2a24; --tag-fg: #bab4a4; --shadow: 0 1px 3px rgba(0,0,0,.4); --shadow-hover: 0 4px 20px rgba(0,0,0,.5);
  color-scheme: dark;
}}
:root[data-theme="dark"] {
  --bg: #100f0d; --surface: #1a1916; --surface2: #232119; --border: #2c2a24;
  --fg: #e8e4da; --fg2: #9a9484; --fg3: #605c50;
  --accent: #4ade80; --accent-bg: #052e16; --accent-hover: #22c55e;
  --remoteok: #34d399; --remoteok-bg: #064e3b; --wwr: #f87171; --wwr-bg: #450a0a;
  --remotive: #60a5fa; --remotive-bg: #1e3a5f; --yc: #fbbf24; --yc-bg: #451a03;
  --wf: #a78bfa; --wf-bg: #2e1065; --gold: #fbbf24; --gold-bg: #451a03;
  --tag-bg: #2c2a24; --tag-fg: #bab4a4; --shadow: 0 1px 3px rgba(0,0,0,.4); --shadow-hover: 0 4px 20px rgba(0,0,0,.5);
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}

/* header */
.hdr{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;
  padding:16px max(20px,env(safe-area-inset-left,0px))}
.hdr-row{max-width:1140px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.1rem;display:flex;align-items:center;gap:8px}
.logo-dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.meta{font-size:.78rem;color:var(--fg3);display:flex;gap:12px;flex-wrap:wrap}
.meta b{color:var(--fg2)}

.prog-wrap{max-width:1140px;margin:0 auto 10px}
.prog-lbl{font-size:.72rem;color:var(--fg3);margin-bottom:4px}
.prog-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;width:0%}

.filters{max-width:1140px;margin:0 auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fg-sep{width:1px;background:var(--border);align-self:stretch;margin:0 2px}
.fb{font-size:.72rem;font-weight:500;padding:4px 10px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--fg2);cursor:pointer;transition:all .12s;white-space:nowrap}
.fb:hover{background:var(--surface2);color:var(--fg)}
.fb.active{background:var(--accent);border-color:var(--accent);color:#fff}

/* source colours for active state */
.fb.a-remoteok{background:var(--remoteok);border-color:var(--remoteok);color:#fff}
.fb.a-wwr{background:var(--wwr);border-color:var(--wwr);color:#fff}
.fb.a-remotive{background:var(--remotive);border-color:var(--remotive);color:#fff}
.fb.a-yc{background:var(--yc);border-color:var(--yc);color:#fff}
.fb.a-wf{background:var(--wf);border-color:var(--wf);color:#fff}

/* main */
.main{max-width:1140px;margin:0 auto;padding-top:20px}

.sh{font-family:'Space Grotesk',sans-serif;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--fg3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sh::after{content:'';flex:1;height:1px;background:var(--border)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:12px}

/* card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;
  display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.card.applied{opacity:.55;border-color:var(--accent)}
.card.hid{display:none}

.ct{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.clogo{width:36px;height:36px;border-radius:9px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.72rem;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--border)}
.badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.bdg{font-size:.62rem;font-weight:600;padding:2px 6px;border-radius:8px;white-space:nowrap}
.b-src-remoteok{background:var(--remoteok-bg);color:var(--remoteok)}
.b-src-wwr{background:var(--wwr-bg);color:var(--wwr)}
.b-src-remotive{background:var(--remotive-bg);color:var(--remotive)}
.b-src-yc{background:var(--yc-bg);color:var(--yc)}
.b-src-wf{background:var(--wf-bg);color:var(--wf)}
.b-remote{background:var(--accent-bg);color:var(--accent)}
.b-high{background:var(--gold-bg);color:var(--gold)}

.ctitle{font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:600;line-height:1.3;text-wrap:balance}
.cco{font-size:.78rem;font-weight:500;color:var(--fg2)}
.cloc{font-size:.7rem;color:var(--fg3)}
.cloc::before{content:'📍';font-size:.65rem;margin-right:3px}
.csal{font-size:.82rem;font-weight:600;color:var(--accent)}
.csal.hi{color:var(--gold)}
.csal.empty{color:var(--fg3);font-weight:400;font-size:.75rem}

.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:.65rem;font-weight:500;padding:2px 7px;border-radius:7px;background:var(--tag-bg);color:var(--tag-fg)}

.cf{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;border-top:1px solid var(--border)}
.at{display:flex;align-items:center;gap:5px;cursor:pointer;font-size:.7rem;color:var(--fg3);user-select:none}
.at input{width:13px;height:13px;cursor:pointer;accent-color:var(--accent)}
.ab{font-size:.74rem;font-weight:600;padding:6px 12px;border-radius:7px;background:var(--accent);color:#fff;text-decoration:none;transition:background .12s;white-space:nowrap}
.ab:hover{background:var(--accent-hover)}

.empty-state{text-align:center;padding:60px 20px;color:var(--fg3)}
.empty-state h3{color:var(--fg2);font-size:.95rem;margin-bottom:4px}

@media(max-width:600px){.hdr{padding:12px 16px}.grid{grid-template-columns:1fr}}
</style>
</head>

function card(j){

  const badgeHigh = isHigh ? `<span class="bdg b-high">💰 High Pay</span>` : '';

    <div class="clogo" style="background:${sm.logo.bg};color:${sm.logo.color}">${ini}</div>
    <div class="badges">

      ${badgeHigh}
      <span class="bdg b-remote">Remote</span>
    </div>
  </div>
  <div class="ctitle">${j.title}</div>
  <div class="cco">${j.co}</div>
  <div class="cloc">${j.loc}</div>
  <div class="csal ${salaryClass(j.salN)}">${salLabel}</div>
  ${tags?`<div class="tags">${tags}</div>`:''}
  <div class="cf">
    <label class="at"><input type="checkbox" onchange="toggleApplied('${j.id}',this)"${appd?' checked':''}><span>${appd?'✅ Applied':'Mark applied'}</span></label>
    <a class="ab" href="${j.url||'#'}" target="_blank" rel="noopener">Apply →</a>
  </div>
</div>`;
}

// ── FILTERS ───────────────────────────────────────────────────────────────────
document.getElementById('filters').addEventListener('click', e=>{
  const btn = e.target.closest('[data-f]');
  if(!btn) return;
  const f = btn.dataset.f, v = btn.dataset.v;
  state[f] = v;
  document.querySelectorAll(`[data-f="${f}"]`).forEach(b=>{
    b.classList.remove('active','a-remoteok','a-wwr','a-remotive','a-yc','a-wf');
  });
  btn.classList.add('active');
  if(v!=='all' && v!=='applied' && f==='source') btn.classList.add('a-'+v);
  applyFilters();
});

function applyFilters(){
  let shown=0;
  document.querySelectorAll('.card').forEach(card=>{
    const id=card.id;
    const srcOk = state.source==='all'||card.dataset.src===state.source;
    const salN  = parseInt(card.dataset.saln)||0;
    let payOk=true;
    if(state.pay==='high') payOk=salN>=100;
    else if(state.pay==='mid') payOk=salN>=50&&salN<100;
    else if(state.pay==='stated') payOk=salN>0;
    let roleOk=true;
    if(state.role==='applied') roleOk=!!applied[id];
    else if(state.role!=='all') roleOk=card.dataset.role===state.role;
    const vis=srcOk&&payOk&&roleOk;
    card.classList.toggle('hid',!vis);
    if(vis) shown++;
  });
  document.getElementById('cnt').textContent=shown;
  document.getElementById('empty').style.display=shown?'none':'block';
}

// ── APPLIED ───────────────────────────────────────────────────────────────────
function toggleApplied(id,cb){
  const card=document.getElementById(id);
  const lbl=card.querySelector('.at span');
  if(cb.checked){ applied[id]=true; card.classList.add('applied'); lbl.textContent='✅ Applied'; }
  else { delete applied[id]; card.classList.remove('applied'); lbl.textContent='Mark applied'; }
  try{ localStorage.setItem(SK,JSON.stringify(applied)); }catch(e){}
  updateProgress();
  if(state.role==='applied') applyFilters();
}

function updateProgress(){
  const c=Object.keys(applied).length, t=JOBS.length, p=Math.round(c/t*100);
  document.getElementById('plbl').textContent=`Applied: ${c} / ${t}`;
  document.getElementById('pfill').style.width=p+'%';
}

// init

applyFilters();
